services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tarot
      POSTGRES_PASSWORD: tarot
      POSTGRES_DB: tarot
    ports: ["5432:5432"]
    volumes: ["tarot-postgres:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  tarot-postgres:
